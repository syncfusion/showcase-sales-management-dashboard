<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <!-- Syncfusion theme first so the factory tokens in the app stylesheet override its variables. -->
    <link rel="stylesheet" href="/styles/syncfusion/tailwind3.css" />
    <title>Showcase - Sales Management</title>
    <script>
      try { var t = localStorage.getItem('oexl-theme'); if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = t; document.documentElement.classList.toggle('e-dark-mode', t === 'dark'); } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
